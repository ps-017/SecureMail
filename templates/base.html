<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SecureMail - Email Security & Threat Analysis{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block head_extra %}{% endblock %}
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="top-bar">
    <div class="top-bar-inner">
      <a href="/" class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="brand-title">SecureMail</h1>
        </div>
      </a>

      <!-- Clean Navigation Links -->
      <nav class="main-nav">
        <a href="/" class="nav-link {% if active_page == 'home' %}active{% endif %}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          Home
        </a>
        <a href="/about" class="nav-link {% if active_page == 'about' %}active{% endif %}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          About Us
        </a>
      </nav>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <!-- Navy-Themed Footer -->
  <footer class="app-footer">
    <div class="footer-inner">
      <div class="footer-branding">
        SecureMail — Phishing and Spam Email Detection System
      </div>
      <div class="footer-subline">
        In-Memory Secure Scan &bull; No email content is stored or logged
      </div>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
